---
# HashiCorp Vault — dev mode deployment for secret management.
# In production, replace -dev with a properly initialised Vault with
# persistent storage, TLS, and HA.  For the course project demo, dev
# mode is sufficient to demonstrate the secrets-management workflow.
#
# NEVER use -dev in production: the root token is printed to stdout and
# the storage backend is in-memory (secrets lost on pod restart).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  labels:
    app: vault
    component: secrets-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.17
          args: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
          ports:
            - containerPort: 8200
              name: vault-port
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: "devops-copilot-root-token"
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:8200"
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]

---
apiVersion: v1
kind: Service
metadata:
  name: vault
  labels:
    app: vault
spec:
  selector:
    app: vault
  ports:
    - name: vault-port
      port: 8200
      targetPort: 8200
  type: ClusterIP
