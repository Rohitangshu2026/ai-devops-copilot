---
# Logstash configuration mounted as ConfigMap — receives Beats input on
# 5044 and forwards parsed JSON to Elasticsearch.
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  labels:
    component: elk
data:
  logstash.conf: |
    input {
      beats {
        port => 5044
      }
    }

    filter {
      # Parse the JSON log line emitted by the app into top-level fields
      json {
        source => "message"
      }

      # Drop non-JSON lines (uvicorn access logs, systemd messages, etc.).
      # The json filter above tags failures with _jsonparsefailure.
      # Filebeat 8.x ECS wraps un-parseable lines in event.original (an object),
      # which conflicts with the event:text mapping in devops-logs-* → HTTP 400.
      if "_jsonparsefailure" in [tags] {
        drop { }
      }

      # Remove the ECS event object that Filebeat 8.x sets on every document.
      # Older devops-logs-* indices have `event` mapped as text (from docs with
      # event: "health_check" plain string).  Indexing event as a nested object
      # causes document_parsing_exception (HTTP 400).  Removing the field avoids
      # the type conflict on both old and new index shards.
      mutate {
        remove_field => ["event"]
      }

      # Promote app-emitted timestamp to @timestamp when present
      if [timestamp] {
        date {
          match => ["timestamp", "ISO8601"]
          target => "@timestamp"
          remove_field => ["timestamp"]
        }
      }

      # Set service from k8s container name (authoritative source).
      # IMPORTANT: within a single Logstash mutate block, add_field executes
      # BEFORE remove_field.  If the event already has a `service` object
      # (Filebeat 8.x ECS agent metadata), add_field hits a type conflict and
      # the field is dropped, then remove_field deletes it — leaving service
      # absent entirely.  Two separate mutate blocks guarantee the delete
      # finishes before the add runs.
      if [kubernetes][container][name] {
        mutate {
          remove_field => ["service"]
        }
        mutate {
          add_field => { "service" => "%{[kubernetes][container][name]}" }
        }
      }
    }

    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "devops-logs-%{+YYYY.MM.dd}"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  labels:
    app: logstash
    component: elk
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
        component: elk
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.12.0
          ports:
            - name: beats
              containerPort: 5044
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms256m -Xmx256m"
            - name: xpack.monitoring.enabled
              value: "false"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          volumeMounts:
            - name: config
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
          livenessProbe:
            httpGet:
              path: /
              port: 9600
            # On a constrained minikube node (competing with ES, Kibana, etc.),
            # JRuby + Logstash pipeline startup takes 90–150s under CPU pressure.
            # 120s initial delay + 5 failures × 30s = up to 4.5 min before restart.
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 18
      volumes:
        - name: config
          configMap:
            name: logstash-config
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  labels:
    app: logstash
    component: elk
spec:
  selector:
    app: logstash
  ports:
    - name: beats
      port: 5044
      targetPort: 5044
  type: ClusterIP
