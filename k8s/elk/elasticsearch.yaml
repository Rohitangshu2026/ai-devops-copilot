---
# Elasticsearch — single-node StatefulSet with persistent storage.
# For demo / single-cluster deployment. Production multi-node requires
# discovery seeds and dedicated master/data/ingest roles.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  labels:
    app: elasticsearch
    component: elk
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
        component: elk
    spec:
      # Init container raises vm.max_map_count for Lucene mmap requirements.
      # Skipped silently on clusters where the host sysctl is already set.
      initContainers:
        - name: sysctl
          image: busybox:1.36
          securityContext:
            privileged: true
            runAsUser: 0
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144 || true"]
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: cluster.name
              value: devops-copilot-es
            - name: bootstrap.memory_lock
              value: "false"
          resources:
            requests:
              memory: "1Gi"
              cpu: "300m"
            limits:
              memory: "1500Mi"
              cpu: "1000m"
          volumeMounts:
            - name: esdata
              mountPath: /usr/share/elasticsearch/data
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: esdata
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    app: elasticsearch
    component: elk
spec:
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: transport
      port: 9300
      targetPort: 9300
  type: ClusterIP
---
# ILM bootstrap Job — runs once after ES is available.
# Installs the devops-incidents-policy used by daily index rollover.
apiVersion: batch/v1
kind: Job
metadata:
  name: es-ilm-bootstrap
  labels:
    component: elk
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: curlimages/curl:8.7.1
          command: ["sh", "-c"]
          args:
            - |
              # Wait until ES is ready
              until curl -s http://elasticsearch:9200/_cluster/health | grep -E '"status":"(green|yellow)"' >/dev/null; do
                echo "waiting for elasticsearch...";
                sleep 5;
              done

              # Install daily-rollover ILM policy
              curl -sf -X PUT http://elasticsearch:9200/_ilm/policy/devops-incidents-policy \
                -H 'Content-Type: application/json' \
                -d '{
                  "policy": {
                    "phases": {
                      "hot": {
                        "actions": {
                          "rollover": {"max_size": "1gb", "max_age": "30d"}
                        }
                      },
                      "delete": {
                        "min_age": "90d",
                        "actions": {"delete": {}}
                      }
                    }
                  }
                }' && echo "ILM policy installed"

              # Install index template referencing the policy
              curl -sf -X PUT http://elasticsearch:9200/_index_template/devops-incidents-template \
                -H 'Content-Type: application/json' \
                -d '{
                  "index_patterns": ["devops-incidents-*"],
                  "template": {
                    "settings": {
                      "index.lifecycle.name": "devops-incidents-policy",
                      "index.lifecycle.rollover_alias": "devops-incidents"
                    }
                  }
                }' && echo "Index template installed"
