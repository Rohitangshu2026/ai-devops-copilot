---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  labels:
    app: kibana
    component: elk
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
        component: elk
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.12.0
          ports:
            - name: http
              containerPort: 5601
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch:9200"
            - name: SERVER_NAME
              value: "kibana"
            - name: SERVER_HOST
              value: "0.0.0.0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 120
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  labels:
    app: kibana
    component: elk
spec:
  selector:
    app: kibana
  ports:
    - name: http
      port: 5601
      targetPort: 5601
  type: ClusterIP
---
# Dashboard import Job — runs once after Kibana is healthy.
# POSTs the saved-objects export to Kibana's import API.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-dashboard
  labels:
    component: elk
data:
  # Mounted as a file at /tmp/dashboard.ndjson; populated from the
  # elk/kibana-dashboard.ndjson file via Ansible at deploy time, or set
  # by `kubectl create configmap kibana-dashboard --from-file=...` for manual deploys.
  README: |
    Populate this ConfigMap with the dashboard NDJSON before the import Job runs:

      kubectl create configmap kibana-dashboard \
        --from-file=dashboard.ndjson=elk/kibana-dashboard.ndjson \
        --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-import-dashboard
  labels:
    component: elk
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: import
          image: curlimages/curl:8.7.1
          command: ["sh", "-c"]
          args:
            - |
              # Wait for Kibana to be healthy
              until curl -sf http://kibana:5601/api/status >/dev/null; do
                echo "waiting for kibana...";
                sleep 5;
              done

              if [ -f /dashboard/dashboard.ndjson ]; then
                echo "Importing dashboard..."
                curl -sf -X POST http://kibana:5601/api/saved_objects/_import?overwrite=true \
                  -H "kbn-xsrf: true" \
                  --form file=@/dashboard/dashboard.ndjson \
                  && echo "Dashboard import complete"
              else
                echo "No dashboard file found in ConfigMap; skipping import"
              fi
          volumeMounts:
            - name: dashboard
              mountPath: /dashboard
      volumes:
        - name: dashboard
          configMap:
            name: kibana-dashboard
            optional: true
