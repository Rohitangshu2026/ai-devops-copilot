apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-backend
  namespace: default
  labels:
    app: agent-backend
  annotations:
    # Service criticality — used by blast-radius safety gate.
    # low | medium | high | critical
    devops-copilot/criticality: "medium"
    # Services this deployment depends on (comma-separated).
    # Used by dynamic dependency map in causality.py.
    devops-copilot/depends-on: "elasticsearch,vault,prometheus"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: agent-backend
      annotations:
        # Picked up by spyroom-owned Prometheus, which scrapes any pod in
        # any namespace that sets these annotations. Removes the need for
        # ai-devops to deploy its own Prometheus.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8001"
    spec:
      # ServiceAccount grants the pod RBAC access to the k8s API
      # (read pods/events, update deployments for action execution).
      serviceAccountName: agent-backend
      containers:
        - name: agent-backend
          image: logicule/agent-backend:latest
          ports:
            - containerPort: 8001
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            # spyroom-platform owns the ELK stack in the `logging` namespace
            # and ships its app logs to index pattern spyroom-logs-YYYY.MM.dd.
            # See ai-devops/docs/CROSS_REPO_CONTRACT.md.
            - name: ES_URL
              value: "http://elasticsearch.logging.svc.cluster.local:9200"
            - name: ES_INDEX
              value: "spyroom-logs-*"
            - name: ENVIRONMENT
              value: "production"
            # Vault address — spyroom-platform owns the dev-mode Vault in the
            # `vault` namespace with root token "root". The llm_secrets role
            # in this repo writes LLM creds to secret/llm-credentials there.
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN
              value: "root"
            # Prometheus owned by spyroom in `monitoring` namespace.
            - name: PROMETHEUS_URL
              value: "http://prometheus.monitoring.svc.cluster.local:9090"
          envFrom:
            - secretRef:
                name: llm-credentials
                optional: true   # optional — Vault takes precedence when reachable
          # startupProbe gates liveness/readiness while uvicorn warms up and
          # the LLM client libraries (anthropic, google-genai) finish their
          # cold-path imports — observed at 15-25 s on this hardware.
          # 30 s + 30 polls × 5 s = 180 s budget.
          startupProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: agent-backend
  namespace: default
spec:
  selector:
    app: agent-backend
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
