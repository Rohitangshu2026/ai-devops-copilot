apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-backend
  namespace: default
  labels:
    app: agent-backend
  annotations:
    # Service criticality — used by blast-radius safety gate.
    # low | medium | high | critical
    devops-copilot/criticality: "medium"
    # Services this deployment depends on (comma-separated).
    # Used by dynamic dependency map in causality.py.
    devops-copilot/depends-on: "elasticsearch"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: agent-backend
    spec:
      # ServiceAccount grants the pod RBAC access to the k8s API
      # (read pods/events, update deployments for action execution).
      serviceAccountName: agent-backend
      containers:
        - name: agent-backend
          image: logicule/agent-backend:latest
          ports:
            - containerPort: 8001
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: ES_URL
              value: "http://elasticsearch.logging.svc.cluster.local:9200"
            - name: ES_INDEX
              value: "devops-logs-*"
            - name: ENVIRONMENT
              value: "production"
            # Vault address — agent reads LLM credentials from Vault
            # if available; falls back to llm-credentials Secret.
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN
              value: "devops-copilot-root-token"
            - name: PROMETHEUS_URL
              value: "http://prometheus.monitoring.svc.cluster.local:9090"
          envFrom:
            - secretRef:
                name: llm-credentials
                optional: true   # optional — Vault takes precedence when reachable
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agent-backend
  namespace: default
spec:
  selector:
    app: agent-backend
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
