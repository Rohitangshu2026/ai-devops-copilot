---
# ServiceAccount used by agent-backend pods to authenticate with the k8s API.
# Grants read access to pods, deployments, and events for agentic tool use,
# and write access to deployments (scale/restart) for action execution.
# Deliberately excludes access to kube-system and monitoring namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-backend
  namespace: default
  labels:
    app: agent-backend

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-backend-role
  labels:
    app: agent-backend
rules:
  # Read pods and events — used by get_k8s_events agentic tool
  - apiGroups: [""]
    resources: ["pods", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
  # Read and update deployments — used by action executor
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Read services and endpoints — used for dependency map
  - apiGroups: [""]
    resources: ["services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
  # Read HPA — used for blast-radius scaling info
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-backend-binding
  labels:
    app: agent-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-backend-role
subjects:
  - kind: ServiceAccount
    name: agent-backend
    namespace: default
