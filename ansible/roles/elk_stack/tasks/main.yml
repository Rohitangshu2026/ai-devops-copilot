---
# ELK Stack deployment — Elasticsearch, Logstash, Kibana, Filebeat
# Order matters: ES first (data plane), Logstash + Filebeat (ingestion),
# Kibana last (UI consumes ES + Filebeat output).

- name: Apply Elasticsearch StatefulSet + ILM bootstrap
  command: kubectl apply -f {{ playbook_dir }}/../k8s/elk/elasticsearch.yaml -n {{ namespace }}
  changed_when: true

- name: Wait for Elasticsearch StatefulSet to be ready
  command: >
    kubectl rollout status statefulset/elasticsearch
    -n {{ namespace }}
    --timeout={{ kubectl_timeout }}
  changed_when: false

- name: Apply Logstash Deployment + ConfigMap
  command: kubectl apply -f {{ playbook_dir }}/../k8s/elk/logstash.yaml -n {{ namespace }}
  changed_when: true

- name: Apply Filebeat DaemonSet + RBAC
  command: kubectl apply -f {{ playbook_dir }}/../k8s/elk/filebeat.yaml -n {{ namespace }}
  changed_when: true

# Provision the Kibana dashboard ConfigMap from the NDJSON file in elk/.
# This must happen before the kibana-import-dashboard Job runs.
- name: Build Kibana dashboard ConfigMap from NDJSON
  shell: |
    kubectl create configmap kibana-dashboard \
      --from-file=dashboard.ndjson={{ playbook_dir }}/../elk/kibana-dashboard.ndjson \
      -n {{ namespace }} \
      --dry-run=client -o yaml | kubectl apply -f -
  changed_when: true
  when: import_kibana_dashboard | bool

- name: Apply Kibana Deployment + dashboard import Job
  command: kubectl apply -f {{ playbook_dir }}/../k8s/elk/kibana.yaml -n {{ namespace }}
  changed_when: true

- name: Wait for Logstash rollout
  command: >
    kubectl rollout status deployment/logstash
    -n {{ namespace }}
    --timeout={{ kubectl_timeout }}
  changed_when: false

- name: Wait for Kibana rollout
  command: >
    kubectl rollout status deployment/kibana
    -n {{ namespace }}
    --timeout={{ kubectl_timeout }}
  changed_when: false

- name: Show ELK pod status
  command: kubectl get pods -n {{ namespace }} -l component=elk -o wide
  register: elk_status
  changed_when: false

- name: Print ELK pod status
  debug:
    msg: "{{ elk_status.stdout_lines }}"
