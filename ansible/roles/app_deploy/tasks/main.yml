---
# ── Kubernetes deployment tasks ───────────────────────────────────────────────
# All tasks use the `command` module so they run identically on Linux, macOS,
# and any CI runner. Requires kubectl in PATH and a valid KUBECONFIG.

- name: Ensure target namespace exists
  command: kubectl create namespace {{ k8s_namespace }} --dry-run=client -o yaml
  register: ns_manifest
  changed_when: false

- name: Apply namespace manifest
  command: kubectl apply -f -
  args:
    stdin: "{{ ns_manifest.stdout }}"
  changed_when: true

# ── LLM credentials secret ────────────────────────────────────────────────────
# Creates or updates the llm-credentials Secret from CI variables.
# At minimum GOOGLE_API_KEYS must be set; LLM_API_KEY may be empty.
# Variables injected by the CI job via -e flags:
#   llm_api_key       (GitLab CI variable LLM_API_KEY)
#   google_api_keys   (GitLab CI variable GOOGLE_API_KEYS)
#   anthropic_api_keys / openai_api_keys (optional)
- name: Create or update LLM credentials secret
  shell: |
    kubectl create secret generic llm-credentials \
      --from-literal=LLM_API_KEY="{{ llm_api_key | default('') }}" \
      --from-literal=GOOGLE_API_KEYS="{{ google_api_keys | default('') }}" \
      --from-literal=ANTHROPIC_API_KEYS="{{ anthropic_api_keys | default('') }}" \
      --from-literal=OPENAI_API_KEYS="{{ openai_api_keys | default('') }}" \
      --from-literal=LLM_MODEL="{{ llm_model | default('gemma-4-31b-it') }}" \
      -n {{ k8s_namespace }} \
      --dry-run=client -o yaml | kubectl apply -f -
  changed_when: true
  no_log: true

- name: Apply RBAC (ServiceAccount + ClusterRole)
  command: >
    kubectl apply -f {{ playbook_dir }}/../k8s/rbac.yaml
    -n {{ k8s_namespace }}
  changed_when: true

- name: Apply NetworkPolicy
  command: >
    kubectl apply -f {{ playbook_dir }}/../k8s/networkpolicy.yaml
    -n {{ k8s_namespace }}
  changed_when: true

- name: Apply sample-app Deployment
  command: >
    kubectl apply -f {{ playbook_dir }}/../k8s/deployment.yaml
    -n {{ k8s_namespace }}
  register: deploy_result
  changed_when: "'configured' in deploy_result.stdout or 'created' in deploy_result.stdout"

- name: Update sample-app image to current build
  command: >
    kubectl set image deployment/sample-app
    sample-app={{ sample_app_image }}
    -n {{ k8s_namespace }}
  changed_when: true
  when: sample_app_image != "logicule/sample-app:latest"

- name: Apply sample-app Service
  command: >
    kubectl apply -f {{ playbook_dir }}/../k8s/service.yaml
    -n {{ k8s_namespace }}
  changed_when: true

- name: Apply sample-app HPA
  command: >
    kubectl apply -f {{ playbook_dir }}/../k8s/hpa.yaml
    -n {{ k8s_namespace }}
  changed_when: true

- name: Apply agent-backend HPA
  command: >
    kubectl apply -f {{ playbook_dir }}/../k8s/hpa-agent-backend.yaml
    -n {{ k8s_namespace }}
  changed_when: true

- name: Apply agent-backend Deployment
  command: >
    kubectl apply -f {{ playbook_dir }}/../k8s/agent-backend.yaml
    -n {{ k8s_namespace }}
  changed_when: true

- name: Update agent-backend image to current build
  command: >
    kubectl set image deployment/agent-backend
    agent-backend={{ agent_image }}
    -n {{ k8s_namespace }}
  changed_when: true
  when: agent_image != "logicule/agent-backend:latest"

- name: Wait for sample-app rollout
  command: >
    kubectl rollout status deployment/sample-app
    -n {{ k8s_namespace }}
    --timeout={{ kubectl_timeout }}
  changed_when: false

- name: Wait for agent-backend rollout
  command: >
    kubectl rollout status deployment/agent-backend
    -n {{ k8s_namespace }}
    --timeout={{ kubectl_timeout }}
  changed_when: false

- name: Show deployed pod status
  command: kubectl get pods -n {{ k8s_namespace }} -l "app in (sample-app,agent-backend)" -o wide
  register: pod_status
  changed_when: false

- name: Print pod status
  debug:
    msg: "{{ pod_status.stdout_lines }}"
