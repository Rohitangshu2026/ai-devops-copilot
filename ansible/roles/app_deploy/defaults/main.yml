---
# Default values — override via -e flags in CI or locally
k8s_namespace: default
# sample_app_image is kept for backwards compatibility with the .gitlab-ci.yml
# `-e "sample_app_image=..."` flag, but it's no longer used by any task in this
# role. The agent now observes spyroom-platform directly per the cross-repo
# contract; sample-app source remains under sample-app/ for offline evals.
sample_app_image: "logicule/sample-app:latest"
agent_image: "logicule/agent-backend:latest"
kubectl_timeout: "120s"

# LLM credentials — pass via CI variables or -e flags.
# At minimum set google_api_keys when using gemma-*/gemini-* models.
llm_api_key: ""
google_api_keys: ""
anthropic_api_keys: ""
openai_api_keys: ""
llm_model: "gemma-4-31b-it"

# Shared secret used to authenticate inbound webhooks from spyroom
# (X-Gitlab-Token). Set this via the GITLAB_WEBHOOK_TOKEN CI variable.
# Empty leaves the agent in permissive mode — fine for local dev,
# unwanted in any shared cluster.
gitlab_webhook_token: ""
