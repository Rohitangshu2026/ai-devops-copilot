---
# Vault connection settings
vault_namespace: default
vault_service_name: vault
vault_port: 8200
vault_root_token: "devops-copilot-root-token"
vault_kv_mount: "secret"
vault_secret_path: "llm-credentials"

# Credentials to write into Vault (overridden via CI -e flags)
llm_api_key: ""
google_api_keys: ""
anthropic_api_keys: ""
openai_api_keys: ""
llm_model: "gemma-4-31b-it"

# How long to wait for Vault to become ready. 240s matches the app_deploy
# rollout-status timeout and covers a cold pull of hashicorp/vault:1.17
# (~440 MB, ~40 s on a fresh runner) plus Vault dev-mode bootstrap (~15 s)
# with comfortable headroom. The previous 60 s consistently failed first-
# deploys on a fresh runner.
vault_ready_timeout: 240
