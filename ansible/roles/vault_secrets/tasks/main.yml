---
# ── Vault deployment and secret provisioning ──────────────────────────────────
# This role:
#   1. Deploys Vault (dev mode) to Kubernetes if not already running.
#   2. Waits for Vault to become ready.
#   3. Enables the KV v2 secrets engine on the "secret/" mount.
#   4. Writes LLM API credentials as a KV secret at secret/llm-credentials.
#
# In production, replace step 1 with an already-initialised Vault instance
# and use Vault Agent Injector for automatic secret injection into pods.

- name: Deploy Vault to Kubernetes
  command: >
    kubectl apply -f {{ playbook_dir }}/../k8s/vault.yaml
    -n {{ vault_namespace }}
  register: vault_apply
  changed_when: "'configured' in vault_apply.stdout or 'created' in vault_apply.stdout"

- name: Wait for Vault pod to be ready
  command: >
    kubectl rollout status deployment/vault
    -n {{ vault_namespace }}
    --timeout={{ vault_ready_timeout }}s
  changed_when: false

- name: Get Vault pod name
  command: >
    kubectl get pod -n {{ vault_namespace }}
    -l app=vault -o jsonpath='{.items[0].metadata.name}'
  register: vault_pod
  changed_when: false

# NOTE: `kubectl exec` does NOT propagate the Ansible host's environment
# into the pod, so we must wrap each `vault` invocation in `sh -c` and
# export VAULT_ADDR + VAULT_TOKEN inside the pod's shell.  Setting them
# under Ansible's `environment:` only affects the kubectl process, not
# the vault CLI running inside the container — that's why the previous
# version of this role hit `permission denied (403)` on `secrets enable`.

- name: Wait for Vault API to respond
  command: >
    kubectl exec -n {{ vault_namespace }} {{ vault_pod.stdout }}
    -- sh -c "VAULT_ADDR=http://127.0.0.1:{{ vault_port }} VAULT_TOKEN={{ vault_root_token }} vault status"
  register: vault_status
  until: vault_status.rc == 0
  retries: 12
  delay: 5
  changed_when: false

- name: Enable KV v2 secrets engine (idempotent)
  command: >
    kubectl exec -n {{ vault_namespace }} {{ vault_pod.stdout }}
    -- sh -c "VAULT_ADDR=http://127.0.0.1:{{ vault_port }} VAULT_TOKEN={{ vault_root_token }} vault secrets enable -version=2 -path={{ vault_kv_mount }} kv"
  register: kv_enable
  # "path is already in use" means it's already enabled — not an error
  failed_when:
    - kv_enable.rc != 0
    - "'path is already in use' not in kv_enable.stderr"
  changed_when: kv_enable.rc == 0

- name: Write LLM credentials to Vault KV store
  command: >
    kubectl exec -n {{ vault_namespace }} {{ vault_pod.stdout }}
    -- sh -c "VAULT_ADDR=http://127.0.0.1:{{ vault_port }} VAULT_TOKEN={{ vault_root_token }} vault kv put {{ vault_kv_mount }}/{{ vault_secret_path }} LLM_API_KEY='{{ llm_api_key | default('') }}' GOOGLE_API_KEYS='{{ google_api_keys | default('') }}' ANTHROPIC_API_KEYS='{{ anthropic_api_keys | default('') }}' OPENAI_API_KEYS='{{ openai_api_keys | default('') }}' LLM_MODEL='{{ llm_model | default('gemma-4-31b-it') }}'"
  changed_when: true
  no_log: true

- name: Verify secret was written
  command: >
    kubectl exec -n {{ vault_namespace }} {{ vault_pod.stdout }}
    -- sh -c "VAULT_ADDR=http://127.0.0.1:{{ vault_port }} VAULT_TOKEN={{ vault_root_token }} vault kv get -field=LLM_MODEL {{ vault_kv_mount }}/{{ vault_secret_path }}"
  register: vault_verify
  changed_when: false
  no_log: true

- name: Confirm secret is accessible
  debug:
    msg: "Vault KV secret written successfully. LLM_MODEL={{ vault_verify.stdout }}"
  when: vault_verify.rc == 0
