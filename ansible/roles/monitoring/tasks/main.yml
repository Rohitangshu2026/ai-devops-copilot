---
# Prometheus + Grafana for agent-backend metrics observability

- name: Apply Prometheus Deployment + RBAC + ConfigMap
  command: kubectl apply -f {{ playbook_dir }}/../k8s/monitoring/prometheus.yaml -n {{ namespace }}
  changed_when: true

- name: Apply Grafana Deployment + datasource provisioning
  command: kubectl apply -f {{ playbook_dir }}/../k8s/monitoring/grafana.yaml -n {{ namespace }}
  changed_when: true

# Provision the Grafana dashboard JSON as a ConfigMap.
# Must run before Grafana pod is fully ready (mount-time provisioning).
- name: Build Grafana dashboard ConfigMap from JSON
  shell: |
    kubectl create configmap grafana-dashboards \
      --from-file=agent-backend.json={{ playbook_dir }}/../monitoring/grafana-dashboard.json \
      -n {{ namespace }} \
      --dry-run=client -o yaml | kubectl apply -f -
  changed_when: true
  when: provision_grafana_dashboard | bool

- name: Restart Grafana to pick up new dashboard ConfigMap
  command: kubectl rollout restart deployment/grafana -n {{ namespace }}
  changed_when: true
  when: provision_grafana_dashboard | bool

- name: Wait for Prometheus rollout
  command: >
    kubectl rollout status deployment/prometheus
    -n {{ namespace }}
    --timeout={{ kubectl_timeout }}
  changed_when: false

- name: Wait for Grafana rollout
  command: >
    kubectl rollout status deployment/grafana
    -n {{ namespace }}
    --timeout={{ kubectl_timeout }}
  changed_when: false

- name: Show monitoring pod status
  command: kubectl get pods -n {{ namespace }} -l component=monitoring -o wide
  register: monitoring_status
  changed_when: false

- name: Print monitoring pod status
  debug:
    msg: "{{ monitoring_status.stdout_lines }}"
