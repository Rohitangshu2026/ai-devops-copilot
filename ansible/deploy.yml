---
# AI DevOps Copilot — full deployment playbook
#
# Roles executed in order:
#   1. vault_secrets  — deploys HashiCorp Vault and writes LLM credentials
#   2. elk_stack      — Elasticsearch StatefulSet + Logstash + Kibana + Filebeat DaemonSet
#   3. monitoring     — Prometheus + Grafana with agent-backend dashboard
#   4. app_deploy     — sample-app + agent-backend Deployments, Services, HPAs, RBAC
#
# All roles are idempotent: running the playbook multiple times produces
# the same result as running it once.  Each role can also be skipped via
# Ansible tags (e.g. --skip-tags monitoring).
#
# CI invocation (self-hosted runner on Mac):
#   ansible-playbook -i inventory.ini deploy.yml \
#     -e "sample_app_image=$IMAGE:$SHA" \
#     -e "google_api_keys=$GOOGLE_API_KEYS" \
#     -e "anthropic_api_keys=$ANTHROPIC_API_KEYS"
#
# Local invocation:
#   ansible-playbook -i inventory.ini deploy.yml \
#     -e "google_api_keys=AIzaSy..."

- name: Deploy AI DevOps Copilot to Kubernetes
  hosts: local
  gather_facts: false
  roles:
    - { role: vault_secrets, tags: [vault, secrets] }
    - { role: elk_stack,     tags: [elk, logs] }
    - { role: monitoring,    tags: [monitoring, metrics] }
    - { role: app_deploy,    tags: [app, deploy] }
