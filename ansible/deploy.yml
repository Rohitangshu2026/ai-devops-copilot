---
# AI DevOps Copilot — deployment playbook.
#
# Per the cross-repo contract with spyroom-platform (see
# docs/CROSS_REPO_CONTRACT.md):
#   * spyroom-platform owns Vault (namespace=vault), ELK (namespace=logging),
#     and Prometheus/Grafana (namespace=monitoring). They must be deployed
#     BEFORE this playbook runs.
#   * This repo deploys only agent-backend (+ sample-app for evals) into the
#     `default` namespace, and writes its LLM credentials into spyroom's
#     Vault at secret/llm-credentials.
#
# CI invocation (self-hosted runner on Mac):
#   ansible-playbook -i inventory.ini deploy.yml \
#     -e "sample_app_image=$IMAGE:$SHA" \
#     -e "google_api_keys=$GOOGLE_API_KEYS" \
#     -e "anthropic_api_keys=$ANTHROPIC_API_KEYS"
#
# Local invocation:
#   ansible-playbook -i inventory.ini deploy.yml \
#     -e "google_api_keys=AIzaSy..."

- name: Deploy AI DevOps Copilot to Kubernetes
  hosts: local
  gather_facts: false
  roles:
    - { role: llm_secrets, tags: [vault, secrets] }
    - { role: app_deploy,  tags: [app, deploy] }
