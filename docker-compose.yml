version: "3.8"

services:

  # ── Elasticsearch ──────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - elk
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 15

  # ── Kibana ─────────────────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    networks:
      - elk
    restart: unless-stopped

  # ── Logstash ───────────────────────────────────────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5044:5044"
    volumes:
      - ./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - XPACK_MONITORING_ENABLED=false
    networks:
      - elk
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9600 | grep -q 'green\\|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Sample App ─────────────────────────────────────────────────────────────
  sample-app:
    build: ./sample-app
    container_name: sample-app
    ports:
      - "8000:8000"
    volumes:
      - app-logs:/app/logs
    networks:
      - elk
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Filebeat ───────────────────────────────────────────────────────────────
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: filebeat
    user: root
    depends_on:
      logstash:
        condition: service_healthy
      sample-app:
        condition: service_healthy
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - app-logs:/app/logs:ro
    networks:
      - elk

  # ── Kibana Dashboard Importer (runs once, then exits) ─────────────────────
  kibana-setup:
    image: curlimages/curl:latest
    container_name: kibana-setup
    depends_on:
      kibana:
        condition: service_started
    restart: "no"
    entrypoint: >
      sh -c "
        echo 'Waiting for Kibana to be ready...';
        until curl -sf http://kibana:5601/api/status | grep -q '\"level\":\"available\"'; do
          sleep 5;
        done;
        echo 'Importing dashboards...';
        curl -sf -X POST http://kibana:5601/api/saved_objects/_import?overwrite=true
          -H 'kbn-xsrf: true'
          --form file=@/dashboards/kibana-dashboard.ndjson;
        echo 'Dashboard import complete.'
      "
    volumes:
      - ./elk:/dashboards:ro
    networks:
      - elk

  # ── Agent Backend ──────────────────────────────────────────────────────────
  agent-backend:
    build: ./agent-backend
    container_name: agent-backend
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "8001:8001"
    env_file:
      - ./agent-backend/.env
    networks:
      - elk
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-logs:
  esdata:    # persists Elasticsearch indices across docker-compose down/up

networks:
  elk:
    driver: bridge
