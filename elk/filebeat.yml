filebeat.inputs:
  - type: filestream
    id: sample-app
    paths:
      - /app/logs/app.log

# Disable ES index template/ILM setup since we're outputting to Logstash
setup.template.enabled: false
setup.ilm.enabled: false

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_stderr: true
