input {
  beats {
    port => 5044
  }
}

filter {
  # Parse the JSON log line emitted by the app into top-level fields
  json {
    source => "message"
    # On success the parsed keys (event, endpoint, status, level, timestamp)
    # are merged into the document root; the raw message field is preserved.
  }

  # Promote the app's own timestamp to @timestamp when present
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "devops-logs-%{+YYYY.MM.dd}"
  }
}
