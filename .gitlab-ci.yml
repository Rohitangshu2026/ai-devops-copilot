stages:
  - test
  - evals
  - build
  - push
  - deploy

# ── Variables ──────────────────────────────────────────────────────────────────
variables:
  DOCKER_TLS_CERTDIR: ""
  SAMPLE_APP_IMAGE: $DOCKER_USERNAME/sample-app
  AGENT_IMAGE: $DOCKER_USERNAME/agent-backend

# ── Test ───────────────────────────────────────────────────────────────────────

test-sample-app:
  stage: test
  image: python:3.11-slim
  script:
    - cd sample-app
    - pip install --quiet -r requirements.txt
    - pytest -q

test-agent-backend:
  stage: test
  image: python:3.11-slim
  script:
    - cd agent-backend
    - pip install --quiet -r requirements.txt
    - pytest tests/ --ignore=tests/e2e --ignore=tests/test_integration_llm.py -q

# ── Eval suite (Phase 9 — fixture-based accuracy gate) ───────────────────────
# Runs the 20-scenario eval suite against mock ES+LLM.
# Fails the pipeline if accuracy gates are not met.
# Required CI variables:
#   none — evals use mocked providers and do not call real LLM APIs
#
# To enable cross-model voting tests with real APIs, add:
#   ANTHROPIC_API_KEYS  (optional)
#   GOOGLE_API_KEYS     (optional)

run-evals:
  stage: evals
  image: python:3.11-slim
  needs: [test-agent-backend]
  script:
    - cd agent-backend
    - pip install --quiet -r requirements.txt
    - cd ..
    - python evals/run_evals.py --scenarios evals/incidents/
  artifacts:
    when: always
    paths:
      - evals/results/
    expire_in: 7 days
  allow_failure: false   # eval gate blocks build on accuracy regression

# ── Build ──────────────────────────────────────────────────────────────────────

build-sample-app:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t $SAMPLE_APP_IMAGE:$CI_COMMIT_SHORT_SHA sample-app/
    - docker save $SAMPLE_APP_IMAGE:$CI_COMMIT_SHORT_SHA > sample-app.tar
  artifacts:
    paths:
      - sample-app.tar
    expire_in: 1 hour

build-agent-backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t $AGENT_IMAGE:$CI_COMMIT_SHORT_SHA agent-backend/
    - docker save $AGENT_IMAGE:$CI_COMMIT_SHORT_SHA > agent-backend.tar
  artifacts:
    paths:
      - agent-backend.tar
    expire_in: 1 hour

# ── Push ───────────────────────────────────────────────────────────────────────

push-sample-app:
  stage: push
  image: docker:24
  services:
    - docker:24-dind
  needs: [build-sample-app]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - docker load < sample-app.tar
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - docker tag $SAMPLE_APP_IMAGE:$CI_COMMIT_SHORT_SHA $SAMPLE_APP_IMAGE:latest
    - docker push $SAMPLE_APP_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $SAMPLE_APP_IMAGE:latest

push-agent-backend:
  stage: push
  image: docker:24
  services:
    - docker:24-dind
  needs: [build-agent-backend]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - docker load < agent-backend.tar
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - docker tag $AGENT_IMAGE:$CI_COMMIT_SHORT_SHA $AGENT_IMAGE:latest
    - docker push $AGENT_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $AGENT_IMAGE:latest

# ── Deploy ─────────────────────────────────────────────────────────────────────
# WHY a self-hosted runner is required here
# ─────────────────────────────────────────
# Minikube binds its API server to 127.0.0.1 (e.g. https://127.0.0.1:53953)
# and stores TLS certificates under ~/.minikube/ on your Mac.  GitLab SaaS
# runners execute inside containers on remote machines — they cannot reach
# your laptop's loopback address or read files from your home directory.
# A self-hosted shell-executor runner registered ON your Mac runs kubectl
# natively, shares your existing ~/.kube/config, and talks to Minikube
# directly without any networking tricks or cert copying.
#
# One-time setup: see docs/local-runner-setup.md
#
# Required CI variables (Settings → CI/CD → Variables):
#   DOCKER_USERNAME         DockerHub username
#   DOCKER_PASSWORD         DockerHub password / access token  ← mark as Masked
#   LLM_API_KEY             Primary LLM API key (injected into Vault by Ansible)
#   GOOGLE_API_KEYS         Google/Gemini API keys
#   ANTHROPIC_API_KEYS      Anthropic Claude API keys
#   OPENAI_API_KEYS         OpenAI API keys (optional)
#   VAULT_ROOT_TOKEN        HashiCorp Vault root token (used by vault_secrets role)
#   SLACK_WEBHOOK_URL       (optional) Slack incoming webhook for approval alerts
#   APPROVAL_SECRET_KEY     HMAC signing key for approval tokens  ← mark as Masked

deploy:
  stage: deploy
  tags:
    - local           # routes ONLY to your self-hosted runner on the Mac
                      # test / build / push continue on GitLab SaaS runners
  needs: [push-sample-app, push-agent-backend]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  before_script:
    # Homebrew binaries are not automatically on PATH inside GitLab Runner jobs
    - export PATH="/opt/homebrew/bin:$PATH"

    # Debug visibility in CI logs
    - echo "PATH=$PATH"
    - which minikube
    - which kubectl
    - which ansible || true

    # Ensure Minikube cluster is running
    - minikube status || minikube start

    # Verify Kubernetes connectivity
    - kubectl cluster-info
  script:
    - cd ansible
    - ansible-playbook -i inventory.ini deploy.yml
      -e "sample_app_image=$SAMPLE_APP_IMAGE:$CI_COMMIT_SHORT_SHA"
      -e "agent_image=$AGENT_IMAGE:$CI_COMMIT_SHORT_SHA"
      -e "vault_root_token=${VAULT_ROOT_TOKEN:-devops-copilot-root-token}"
      -e "llm_api_key=${LLM_API_KEY:-}"
      -e "google_api_keys=${GOOGLE_API_KEYS:-}"
      -e "anthropic_api_keys=${ANTHROPIC_API_KEYS:-}"
      -e "openai_api_keys=${OPENAI_API_KEYS:-}"
      -e "slack_webhook_url=${SLACK_WEBHOOK_URL:-}"
      -e "approval_secret_key=${APPROVAL_SECRET_KEY:-change-me}"
  environment:
    name: production
    url: http://localhost:8001
