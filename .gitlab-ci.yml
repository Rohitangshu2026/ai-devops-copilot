stages:
  - test
  - build
  - push
  - deploy

test-sample-app:
  stage: test
  image: python:3.11
  script:
    - cd sample-app
    - pip install -r requirements.txt
    - pytest

test-agent-backend:
  stage: test
  image: python:3.11
  script:
    - cd agent-backend
    - pip install -r requirements.txt
    - pytest

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t $DOCKER_USERNAME/sample-app:$CI_COMMIT_SHORT_SHA sample-app/
    - docker save $DOCKER_USERNAME/sample-app:$CI_COMMIT_SHORT_SHA > image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

push:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - docker load < image.tar
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - docker tag $DOCKER_USERNAME/sample-app:$CI_COMMIT_SHORT_SHA $DOCKER_USERNAME/sample-app:latest
    - docker push $DOCKER_USERNAME/sample-app:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_USERNAME/sample-app:latest

deploy:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  script:
    - echo "To deploy, run:"
    - echo "cd ansible && ansible-playbook -i inventory.ini deploy.yml"
