stages:
  - test
  - build
  - push
  - deploy

test:
  stage: test
  image: python:3.10
  script:
    - cd sample-app
    - pip install -r requirements.txt
    - pytest

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - cd sample-app
    - docker build -t $DOCKER_USERNAME/sample-app:latest .

push:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - cd sample-app
    - docker build -t $DOCKER_USERNAME/sample-app:latest .
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - docker push $DOCKER_USERNAME/sample-app:latest

deploy:
  stage: deploy
  when: manual
  script:
    - echo "To deploy locally, run:"
    - echo "cd ansible && ansible-playbook -i inventory.ini deploy.yml"