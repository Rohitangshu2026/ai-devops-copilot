stages:
  - test
  - build
  - push
  - deploy

variables:
  IMAGE_NAME: $DOCKER_USERNAME/sample-app

test:
  stage: test
  image: python:3.11
  script:
    - cd sample-app
    - pip install -r requirements.txt
    - pytest

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA sample-app/
    - docker save $IMAGE_NAME:$CI_COMMIT_SHORT_SHA > image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

push:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  needs: [build]
  only:
    - main
  script:
    - docker load < image.tar
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - docker tag $IMAGE_NAME:$CI_COMMIT_SHORT_SHA $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_NAME:latest

deploy:
  stage: deploy
  image: alpine:latest
  when: manual
  only:
    - main
  script:
    - echo "To deploy, run:"
    - echo "cd ansible && ansible-playbook -i inventory.ini deploy.yml"
