stages:
  - test
  - build

test:
  image: python:3.11
  stage: test
  before_script:
    - cd sample-app
    - pip install -r requirements.txt
  script:
    - pytest

build:
  image: docker:24.0.5
  stage: build
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - cd sample-app
  script:
    - docker build -t sample-app:ci .