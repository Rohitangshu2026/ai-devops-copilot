stages:
  - test
  - build
  - push
  - deploy

test:
  stage: test
  image: python:3.10
  script:
    - cd sample-app
    - pip install -r requirements.txt
    - pytest

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $DOCKER_USERNAME/sample-app:latest .

push:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - docker push $DOCKER_USERNAME/sample-app:latest

deploy:
  stage: deploy
  when: manual
  script:
    - echo "Run ansible locally to deploy latest image"